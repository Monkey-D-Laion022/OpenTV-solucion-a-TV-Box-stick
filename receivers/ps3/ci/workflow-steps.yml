# Pasos para AGREGAR AL FINAL del job «diagnose-ps3» de .github/workflows/build.yml (después del paso que ejecuta build-deps.sh).
# No se modifica el job de Android ni los pasos de diagnóstico existentes. Indentación: 6 espacios, igual que los demás pasos del job.
      - name: PS3 · localizar el SDK (GCC real) y mostrar herramientas
        run: |
          SDK="${PS3DEV:-$RUNNER_TEMP/ps3dev}"
          if [ ! -x "$SDK/ppu/bin/ppu-gcc" ]; then
            echo "No se encontró ppu-gcc en $SDK. Candidatos:"; find "$RUNNER_TEMP" -maxdepth 4 -name 'ppu-gcc*' 2>/dev/null; exit 1
          fi
          echo "PS3DEV=$SDK" >> "$GITHUB_ENV"
          make -C receivers/ps3 tools PS3DEV="$SDK"

      - name: PS3 · compilar dependencias, receptor y generar el PKG
        run: make -C receivers/ps3 ci PS3DEV="$PS3DEV"

      - name: PS3 · comprobar que el PKG existe
        run: |
          test -s receivers/ps3/build/opentv-ps3.pkg
          ls -la receivers/ps3/build/opentv-ps3.pkg
          sha256sum receivers/ps3/build/opentv-ps3.pkg

      - name: PS3 · subir el PKG como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: opentv-ps3-pkg
          path: receivers/ps3/build/opentv-ps3.pkg
          if-no-files-found: error

      - name: PS3 · subir ELF y contenido del paquete (depuración)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opentv-ps3-debug
          path: |
            receivers/ps3/build/opentv-ps3.stripped.elf
            receivers/ps3/build/pkg/
          if-no-files-found: ignore

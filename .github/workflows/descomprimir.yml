name: Descomprimir
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir y subir
        run: |
          for z in *.zip; do
            unzip -oq "$z" -d tmp
            cp -a tmp/OpenTV/. .
            rm -rf tmp "$z"
          done
          rm -rf .github/workflows/build.yml.bak
          chmod +x gradlew
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "Aplicar parche"
          git push

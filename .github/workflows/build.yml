name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Dar permiso a gradlew
        run: chmod +x gradlew
      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Pruebas unitarias y APK de depuración
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Guardar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: app/build/reports/tests/
          if-no-files-found: ignore

  build-ps3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias del sistema para PS3
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool zlib1g-dev wget python3
      - name: Configurar toolchain y compilar receptor PS3
        run: |
          make -C ps3/ clean || make clean
          make -C ps3/ || make
      - name: Guardar PKG de PS3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: opentv-ps3-pkg
          path: |
            *.pkg
            ps3/*.pkg
            build/*.pkg
          if-no-files-found: warn
          

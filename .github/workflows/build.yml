name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso a gradlew
        run: chmod +x gradlew

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pruebas unitarias y APK de depuración
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: app/build/reports/tests/
          if-no-files-found: ignore

  diagnose-ps3:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Se usa SOLO el ppu-gcc real del SDK ps3dev (con sus headers Newlib). El flujo experimental con Clang
      # (receivers/ps3/toolchain/*.sh) quedó obsoleto: su wrapper usaba rutas fijas y fallaba con «stdio.h file not found».
      - name: PS3 - instalar y comprobar el SDK real
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash receivers/ps3/ci/setup-sdk.sh

      - name: PS3 - herramientas del SDK
        run: make -C receivers/ps3 tools PS3DEV="$PS3DEV"

      - name: PS3 - compilar dependencias (FAAD2 y mbedTLS), receptor y PKG
        run: make -C receivers/ps3 ci PS3DEV="$PS3DEV"

      - name: PS3 - comprobar que el PKG existe
        run: |
          test -s receivers/ps3/build/opentv-ps3.pkg
          ls -la receivers/ps3/build/opentv-ps3.pkg
          sha256sum receivers/ps3/build/opentv-ps3.pkg

      - name: PS3 - subir el PKG como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: opentv-ps3-pkg
          path: receivers/ps3/build/opentv-ps3.pkg
          if-no-files-found: error

      - name: PS3 - subir archivos de depuracion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opentv-ps3-debug
          path: |
            receivers/ps3/build/opentv-ps3.stripped.elf
            receivers/ps3/build/pkg/
            receivers/ps3/build/deps/faad-build/
          if-no-files-found: ignore


name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso a gradlew
        run: chmod +x gradlew

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pruebas unitarias y APK de depuración
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: app/build/reports/tests/
          if-no-files-found: ignore

  diagnose-ps3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar toolchain PS3
        run: |
          chmod +x receivers/ps3/toolchain/bootstrap.sh
          bash receivers/ps3/toolchain/bootstrap.sh

      - name: Diagnosticar SDK y compilador PPU
        run: |
          chmod +x receivers/ps3/toolchain/build-deps.sh
          bash receivers/ps3/toolchain/build-deps.sh

      - name: Guardar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenTV-PS3-diagnostico
          path: |
            ${{ runner.temp }}/ps3build/diagnostic/
          if-no-files-found: ignore
          

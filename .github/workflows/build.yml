
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso a gradlew
        run: chmod +x gradlew

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pruebas unitarias y APK de depuración
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: app/build/reports/tests/
          if-no-files-found: ignore

  diagnose-ps3:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar y construir dependencias PS3
        shell: bash
        run: |
          set -Eeuo pipefail
          export PS3_BUILD_ROOT="$RUNNER_TEMP/ps3build"

          TOOLCHAIN="receivers/ps3/toolchain"

          chmod +x "$TOOLCHAIN"/*.sh

          echo "============================================"
          echo " FASE 1: PREPARAR SDK"
          echo "============================================"

          source "$TOOLCHAIN/bootstrap.sh"

          echo "============================================"
          echo " FASE 2: DESCARGAR DEPENDENCIAS"
          echo "============================================"

          bash "$TOOLCHAIN/fetch-deps.sh"

          echo "============================================"
          echo " FASE 3: COMPILAR FAAD2"
          echo "============================================"

          bash "$TOOLCHAIN/build-faad2.sh"

          echo "============================================"
          echo " FASE 4: COMPILAR MBEDTLS"
          echo "============================================"

          bash "$TOOLCHAIN/build-mbedtls.sh"

          echo "============================================"
          echo " FASE 5: DIAGNOSTICO FINAL"
          echo "============================================"

          bash "$TOOLCHAIN/build-deps.sh"

          echo "============================================"
          echo " PROCESO PS3 FINALIZADO"
          echo "============================================"

      - name: Guardar diagnosticos PS3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenTV-PS3-diagnostico
          path: ${{ runner.temp }}/ps3build/
          if-no-files-found: ignore

      - name: PS3 - localizar el SDK GCC real
        run: |
          SDK="${PS3DEV:-$RUNNER_TEMP/ps3dev}"
          if [ ! -x "$SDK/ppu/bin/ppu-gcc" ]; then
            echo "No se encontró ppu-gcc en $SDK. Candidatos:"
            find "$RUNNER_TEMP" -maxdepth 4 -name 'ppu-gcc*' 2>/dev/null
            exit 1
          fi
          echo "PS3DEV=$SDK" >> "$GITHUB_ENV"
          make -C receivers/ps3 tools PS3DEV="$SDK"

      - name: PS3 - compilar y empaquetar el receptor
        run: make -C receivers/ps3 ci PS3DEV="$PS3DEV"

      - name: PS3 - comprobar que el PKG existe
        run: |
          test -s receivers/ps3/build/opentv-ps3.pkg
          ls -la receivers/ps3/build/opentv-ps3.pkg
          sha256sum receivers/ps3/build/opentv-ps3.pkg

      - name: PS3 - subir el PKG como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: opentv-ps3-pkg
          path: receivers/ps3/build/opentv-ps3.pkg
          if-no-files-found: error

      - name: PS3 - subir archivos de depuración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opentv-ps3-debug
          path: |
            receivers/ps3/build/opentv-ps3.stripped.elf
            receivers/ps3/build/pkg/
          if-no-files-found: ignore
          
